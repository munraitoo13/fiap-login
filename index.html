<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
  </head>
  <body>
    <!-- main -->
    <main class="vh-100 d-flex justify-content-center align-items-center">
      <!-- login -->
      <section
        class="w-50 d-flex justify-content-center align-items-center border rounded p-5 gap-5">
        <!-- logo -->
        <div class="w-50">
          <img class="img-fluid" src="./img/logo.png" alt="fiap logo" />
        </div>

        <!-- form -->
        <div class="w-50 d-flex flex-column gap-3">
          <!-- main text -->
          <h1 class="text-center fs-3">Área reservada</h1>

          <!-- inputs -->
          <form class="d-flex flex-column align-items-center gap-3">
            <!-- email -->
            <div class="w-100 d-flex flex-column align-items-center">
              <input class="form-control" type="email" />
              <label>Email</label>
            </div>

            <!-- password -->
            <div class="w-100 d-flex flex-column align-items-center">
              <input class="form-control" type="password" />
              <label>Password</label>
            </div>

            <!-- submit -->
            <button
              class="btn btn-info text-black fw-semibold w-auto"
              type="submit">
              Login
            </button>
          </form>

          <!-- buttons -->
          <div
            class="d-flex flex-column justify-content-center align-items-center gap-3">
            <small>
              Esqueci
              <b
                ><a class="text-black" href="#">Usuário</a> /
                <a class="text-black" href="#">Senha</a>?</b
              >
            </small>
            <a class="text-info" href="./pages/register.html">Criar Login</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
