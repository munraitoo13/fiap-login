<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
    <script src="../scripts/register.js" defer></script>
  </head>
  <body>
    <!-- main -->
    <main
      class="vh-100 d-flex flex-column align-items-center justify-content-center">
      <!-- content -->
      <div class="w-50">
        <!-- main text -->
        <h1 class="fs-3">Criação de Login</h1>

        <!-- form -->
        <form class="needs-validation d-flex flex-column gap-3" novalidate>
          <!-- form group user -->
          <div>
            <label for="user" class="form-label">Usuário:</label>
            <input
              required
              class="form-control"
              id="user"
              type="text"
              placeholder="Digite o usuário" />
            <div class="valid-feedback">Informação válida</div>
            <div class="invalid-feedback">Preencha o dado do usuário</div>
          </div>

          <!-- form group password -->
          <div>
            <label for="password" class="form-label">Senha:</label>
            <input
              required
              class="form-control"
              id="password"
              type="password"
              placeholder="Digite a senha" />
            <div class="valid-feedback">Informação válida</div>
            <div class="invalid-feedback">Informe a senha</div>
          </div>

          <!-- form group confirm -->
          <div>
            <label for="password-confirmation" class="form-label"
              >Confirmação senha:</label
            >
            <input
              required
              class="form-control"
              id="confirmPassword"
              type="password"
              placeholder="Confirme a senha" />
            <div class="valid-feedback">Informação válida</div>
            <div class="invalid-feedback">Informe a senha</div>
          </div>

          <!-- form group eula -->
          <div>
            <input
              required
              class="form-check-input"
              id="eula"
              type="checkbox" />
            <label class="form-check-label" for="eula"
              >Eu concordo com os termos de aceite</label
            >
            <div class="valid-feedback">Informação válida</div>
            <div class="invalid-feedback">Clique em concordar para seguir</div>
          </div>

          <!-- buttons -->
          <div>
            <!-- submit -->
            <button class="btn btn-primary" type="submit">Registrar</button>

            <!-- clear form -->
            <button class="btn btn-primary" type="reset">
              Limpar formulário
            </button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
